# Runs the offline unit tests on every push. The tests make no API call and download no page,
# so the workflow needs no secrets.
name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run the unit tests
        run: python -m unittest discover -s tests
